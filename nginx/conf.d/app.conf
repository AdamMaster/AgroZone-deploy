# ШАГ 2 из 2 (см. DEPLOY.md) — рабочий конфиг с HTTPS, включается после
# того, как certbot уже выпустил сертификат (см. nginx/bootstrap/app.conf).
#
# Домен: фронт на agro-zone.ru, API на отдельном поддомене api.agro-zone.ru.
# Поддомен для API — не просто вкусовщина: сессионная кука ставится с
# SESSION_DOMAIN='.agro-zone.ru' (см. server/.env), и на общем родительском
# домене она автоматически расшаривается между agro-zone.ru и
# api.agro-zone.ru — авторизация работает одинаково что на фронте, что при
# прямых запросах к API. Если добавите ещё поддомены — эта же кука будет
# видна и там.
#
# ЗАМЕНИТЬ agro-zone.ru / api.agro-zone.ru на реальный домен перед стартом, и
# синхронно поправить в server/.env: APPLICATION_URL, ALLOWED_ORIGIN,
# SESSION_DOMAIN, SESSION_SECURE=true.

# --- фронт (agro-zone.ru) ---
server {
    listen 80;
    server_name agro-zone.ru www.agro-zone.ru;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name agro-zone.ru www.agro-zone.ru;

    ssl_certificate     /etc/letsencrypt/live/agro-zone.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agro-zone.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Фото объявлений — до 10МБ на файл (см. photo-uploader.tsx), в одном
    # запросе может уйти сразу несколько — берём с запасом.
    client_max_body_size 50m;

    location / {
        proxy_pass http://client:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- API (api.agro-zone.ru) ---
server {
    listen 80;
    server_name api.agro-zone.ru;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.agro-zone.ru;

    ssl_certificate     /etc/letsencrypt/live/agro-zone.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agro-zone.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 50m;

    location / {
        proxy_pass http://server:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Семантический поиск / загрузка фото — не всегда укладываются в
        # дефолтные 60с, особенно на первом холодном запросе (прогрев
        # ONNX-модели эмбеддингов).
        proxy_read_timeout 120s;
    }
}
