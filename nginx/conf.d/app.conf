# ШАГ 2 из 2 (см. DEPLOY.md) — рабочий конфиг с HTTPS, включается после
# того, как certbot уже выпустил сертификат (см. nginx/bootstrap/app.conf).
#
# Домен: фронт на agro-zone.ru, API на отдельном поддомене api.agro-zone.ru.
# Поддомен для API — не просто вкусовщина: сессионная кука ставится с
# SESSION_DOMAIN='.agro-zone.ru' (см. server/.env), и на общем родительском
# домене она автоматически расшаривается между agro-zone.ru и
# api.agro-zone.ru — авторизация работает одинаково что на фронте, что при
# прямых запросах к API. Если добавите ещё поддомены — эта же кука будет
# видна и там.
#
# ЗАМЕНИТЬ agro-zone.ru / api.agro-zone.ru на реальный домен перед стартом, и
# синхронно поправить в server/.env: APPLICATION_URL, ALLOWED_ORIGIN,
# SESSION_DOMAIN, SESSION_SECURE=true.
#
# $connection_upgrade — стандартный nginx-приём для проксирования
# WebSocket (см. чат поддержки, SupportGateway/socket.io): апгрейд-запрос
# приходит с заголовком Connection: upgrade, обычный HTTP — без него;
# map должен жить на верхнем уровне (внутри http{}, куда этот файл и
# инклюдится через conf.d/*.conf), внутри server{}/location{} нельзя.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Убирает версию из заголовка Server и со страниц ошибок: было
# «Server: nginx/1.27.5», станет просто «Server: nginx». Само по себе это не
# защита — но точная версия избавляет атакующего от необходимости перебирать
# эксплойты, а нам не стоит ничего. Директива на уровне http, так что
# действует на все server-блоки ниже, включая 80-е редиректные.
server_tokens off;

# --- фронт (agro-zone.ru) ---
server {
    listen 80;
    server_name agro-zone.ru www.agro-zone.ru;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name agro-zone.ru www.agro-zone.ru;

    ssl_certificate     /etc/letsencrypt/live/agro-zone.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agro-zone.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/conf.d/security-headers.inc;

    # --- Content-Security-Policy, пока в режиме отчёта ---
    #
    # Report-Only не блокирует НИЧЕГО: браузер лишь пишет нарушения в консоль.
    # Это осознанный первый шаг — включать боевую CSP вслепую на работающем
    # сайте нельзя: одна забытая строка и молча отваливается карта, капча или
    # подсказки адресов, причём только у части пользователей. Смотрим неделю на
    # реальные нарушения, дополняем список, и только потом переименовываем
    # заголовок в Content-Security-Policy без -Report-Only.
    #
    # Источники ниже — не абстрактный шаблон, а ровно то, чем пользуется фронт:
    # @2gis/mapgl (карта в объявлении), @yandex/smart-captcha, react-dadata
    # (подсказки адресов), S3 с фотографиями, собственный API вместе с
    # WebSocket-каналом чата.
    #
    # mc.yandex.ru — счётчик Яндекс.Метрики (F15 в ROADMAP.md, YandexMetrika
    # в components/layout/analytics): сам тег грузится со script-src,
    # события/просмотры страниц уходят через connect-src, а pixel для
    # <noscript> — через img-src.
    set $csp "default-src 'self'";
    set $csp "${csp}; base-uri 'self'";
    set $csp "${csp}; object-src 'none'";
    set $csp "${csp}; frame-ancestors 'none'";
    # Внешних шрифтов нет: next/font складывает их в наш же бандл при сборке.
    set $csp "${csp}; font-src 'self' data:";
    # blob: — превью фотографий в форме подачи (URL.createObjectURL).
    set $csp "${csp}; img-src 'self' data: blob: https://s3.twcstorage.ru https://*.2gis.com https://mc.yandex.ru";
    set $csp "${csp}; media-src 'self' blob:";
    set $csp "${csp}; worker-src 'self' blob:";
    # 'unsafe-inline' тут пока обязателен: Next.js передаёт RSC-payload
    # инлайновыми скриптами (плюс сам инлайновый init-скрипт Метрики,
    # YandexMetrika). Убрать его можно только вместе с переходом на
    # nonce-схему через middleware — отдельная задача, не в этом заходе.
    set $csp "${csp}; script-src 'self' 'unsafe-inline' https://smartcaptcha.yandexcloud.net https://mapgl.2gis.com https://mc.yandex.ru";
    set $csp "${csp}; style-src 'self' 'unsafe-inline'";
    set $csp "${csp}; connect-src 'self' https://api.agro-zone.ru wss://api.agro-zone.ru https://*.2gis.com https://suggestions.dadata.ru https://smartcaptcha.yandexcloud.net https://mc.yandex.ru";
    set $csp "${csp}; frame-src https://smartcaptcha.yandexcloud.net";
    # Вход через Яндекс ID уходит редиректом на oauth.yandex.ru.
    set $csp "${csp}; form-action 'self' https://oauth.yandex.ru";
    add_header Content-Security-Policy-Report-Only $csp always;

    # Фото объявлений — до 10МБ на файл (см. photo-uploader.tsx), в одном
    # запросе может уйти сразу несколько — берём с запасом.
    client_max_body_size 50m;

    # resolver + переменная вместо статичного proxy_pass: nginx резолвит
    # имя контейнера лениво, при первом запросе, через встроенный DNS
    # докера (127.0.0.11), а не один раз при старте. Со статичным именем
    # (proxy_pass http://client:3000) nginx падает с "emerg host not
    # found in upstream", если поймает контейнер долей секунды раньше,
    # чем докеровский DNS внутри его сети успеет подняться — и это
    # намертво валит весь nginx (restart: always зацикливает падение).
    resolver 127.0.0.11 valid=10s;

    location / {
        set $upstream_client client:3000;
        proxy_pass http://$upstream_client;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- API (api.agro-zone.ru) ---
server {
    listen 80;
    server_name api.agro-zone.ru;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.agro-zone.ru;

    ssl_certificate     /etc/letsencrypt/live/agro-zone.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agro-zone.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Те же заголовки, что и на фронте. CSP тут не нужна — API отдаёт JSON,
    # исполнять и встраивать в нём нечего, а вот nosniff и HSTS нужны: по
    # api.agro-zone.ru ходит браузер с сессионной кукой.
    include /etc/nginx/conf.d/security-headers.inc;

    client_max_body_size 50m;

    # см. комментарий про resolver в блоке фронта выше — та же причина.
    resolver 127.0.0.11 valid=10s;

    location / {
        set $upstream_server server:4000;
        proxy_pass http://$upstream_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Семантический поиск / загрузка фото — не всегда укладываются в
        # дефолтные 60с, особенно на первом холодном запросе (прогрев
        # ONNX-модели эмбеддингов).
        proxy_read_timeout 120s;

        # Без этих двух заголовков socket.io (чат поддержки, /socket.io/…)
        # тихо не сломается, а просто никогда не апгрейднется до
        # WebSocket — молча останется на HTTP long-polling фоллбэке, и
        # заметить это на глаз почти невозможно (чат продолжит работать,
        # просто с задержкой и лишней нагрузкой вместо честного realtime).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
