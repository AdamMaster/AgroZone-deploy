# ШАГ 1 из 2 (см. DEPLOY.md). Этот конфиг — временный, только HTTP, без
# SSL, нужен ровно для того, чтобы certbot смог пройти ACME HTTP-01
# challenge (Let's Encrypt должен постучаться на 80-й порт домена и
# получить файл из /.well-known/acme-challenge/). Как только сертификат
# выпущен — переключаемся на nginx/conf.d/app.conf (там уже HTTPS) и этот
# файл больше не нужен.
#
# ЗАМЕНИТЬ example.ru / api.example.ru на реальный домен перед стартом.

server {
    listen 80;
    server_name example.ru www.example.ru api.example.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 'ok, ждём выпуска TLS-сертификата';
        add_header Content-Type text/plain;
    }
}
