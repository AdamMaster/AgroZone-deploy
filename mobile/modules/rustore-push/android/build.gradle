plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.rustorepush'
version = '1.0.0'

android {
  namespace "expo.modules.rustorepush"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

// Репозиторий RuStore с SDK push. Его же добавляет в корневой build.gradle
// плагин plugins/with-rustore-push.js: зависимости модуля разрешает и само
// приложение, а не только эта библиотека.
repositories {
  maven {
    url = uri('https://nexus-external.rustore.ru/repository/maven-rustore-exposed/')
  }
  maven {
    url = uri('https://artifactory-external.vkpartner.ru/artifactory/maven')
  }
}

dependencies {
  implementation 'ru.rustore.sdk:pushclient:7.5.0'
}
