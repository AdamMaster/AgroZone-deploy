plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.networkresilience'
version = '1.0.0'

android {
  namespace "expo.modules.networkresilience"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // Фабрика клиента наследует клиент React Native (OkHttpClientProvider), а тот
  // строится на OkHttp той же версии, что у React Native и expo-file-system.
  implementation 'com.facebook.react:react-android'
  implementation 'com.squareup.okhttp3:okhttp:4.9.2'
}
