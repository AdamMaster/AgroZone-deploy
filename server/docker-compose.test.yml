version: '3.8'

# Дополнительные сервисы ТОЛЬКО для E2E-тестов (Playwright). Не заменяет
# основной docker-compose.yml, а дополняет его — запускать вместе:
#   docker compose -f docker-compose.yml -f docker-compose.test.yml up -d
#
# Mailpit — локальный "перехватчик" почты: сервер принимает письма по SMTP
# (порт 1025) так же, как настоящий Gmail, но никуда их не отправляет, а
# складывает у себя и отдаёт через HTTP API (порт 8025) — именно оттуда
# Playwright-тесты забирают ссылку подтверждения из письма, не трогая ваш
# реальный Gmail-ящик.
services:
  mailpit:
    container_name: agro-zone-mailpit
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP — сюда сервер приложения "отправляет" письма
      - '8025:8025' # HTTP API/веб-интерфейс — отсюда тесты их читают
    networks:
      - backend

networks:
  backend:
    driver: bridge
